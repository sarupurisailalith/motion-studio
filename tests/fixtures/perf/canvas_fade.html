<!doctype html><html><head><meta charset="utf-8"><title>perf fixture: canvas faded by CSS</title>
<!-- E8.1 fixture: from t=0.5 seek() fades the canvas element with CSS opacity, so the page stops
     qualifying mid-render and the worker must switch to screenshots. -->
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c"></canvas><script>
const q = new URLSearchParams(location.search), W = +q.get('w') || 320, H = +q.get('h') || 320;
window.MOTION = { width: W, height: H, fps: 30, duration: 1, loop: false };
const c = document.getElementById('c'); c.width = W; c.height = H;
const x = c.getContext('2d');
window.ready = Promise.resolve();
window.seek = t => {
  const g = x.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, `hsl(${t * 300}, 70%, 55%)`); g.addColorStop(1, '#101418');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.fillStyle = '#f2efe9'; x.beginPath(); x.arc(W * (0.2 + 0.6 * t), H / 2, H / 6, 0, 2 * Math.PI); x.fill();
  c.style.opacity = t < 0.5 ? '' : String(1 - (t - 0.5));
  x.fillStyle = '#111'; x.font = `bold ${H / 10}px sans-serif`; x.fillText(t.toFixed(3), W / 10, H * 0.9);
};
</script></body></html>
