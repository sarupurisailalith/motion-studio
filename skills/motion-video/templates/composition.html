<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motion Composition</title>
<!--
  MOTION STUDIO — deterministic composition template (DOM / SVG / Canvas 2D)
  Copy this file AND kit.js (the shared motion kit, window.K) into the project folder.

  THE CONTRACT (render.py relies on it — do not break):
    window.MOTION   = { width, height, fps, duration, loop }
    window.ready    = Promise that resolves once fonts/images are loaded
    window.seek(t)  = draws the exact picture for time t (seconds). Pure function
                      of t: same t -> same pixels, in any order, any number of times.

  RULES
    - No CSS transitions/animations, no setTimeout/setInterval/rAF-driven state,
      no accumulated physics, no Date.now()/performance.now() inside the scene.
    - Randomness only via K.rand(seed, i) (hash-based, seeded).
    - Embed or locally reference every asset (fonts, images). No network at render.
    - Preview: open the file in a browser — it plays, Space pauses, ←/→ step frames,
      F cycles formats (native → 16x9 → 9x16 → 1x1 → 4x5), G shows the safe areas,
      ?t=3.25 freezes that moment, ?loop=0 stops looping.
-->
<style>
  :root{
    --bg:#f2efe9; --ink:#111111; --accent:#ff4d1f; --muted:#8a857c;
    /* System stack on purpose: no font ships with the plugin. For brand type, ingest the font
       (ingest.py → assets/fonts.css) and put its family first. */
    --font-display: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  /* The stage is always authored at MOTION.width x MOTION.height and scaled to fit for preview. */
  #stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:var(--bg)}
  #stage *{box-sizing:border-box}
  .abs{position:absolute;left:0;top:0;will-change:auto}
  /* --- scene styles below --- */
  #camera{position:absolute;inset:0;transform-origin:50% 50%}
  .word{font-family:var(--font-display);font-weight:800;letter-spacing:-0.06em;color:var(--ink);
        line-height:.9;white-space:nowrap}
  .mask{overflow:hidden;position:absolute}
  #fill{position:absolute;left:14px;top:14px;bottom:14px;border-radius:999px;background:var(--bg)}
  .glyph{display:inline-block}
  #hud{font:500 22px/1 ui-monospace,Menlo,monospace;color:var(--muted);letter-spacing:.08em}
  #preview-ui{position:fixed;left:0;right:0;bottom:0;height:28px;display:flex;gap:8px;align-items:center;
      padding:0 10px;background:rgba(0,0,0,.6);color:#fff;font:12px ui-monospace,monospace;z-index:9}
  #preview-ui input{flex:1}
  #safe-overlay{position:absolute;left:0;top:0;pointer-events:none;display:none;z-index:8}
</style>
</head>
<body>
<div id="stage">
  <div id="camera">
    <!-- SCENE MARKUP: author everything in stage pixels -->
    <div id="blob" class="abs"><div id="fill"></div></div>
    <!-- data-safe: render.py keeps this box inside K.safe.ui (the mask, sized to the word).
         data-text: the readable-duration gate, on the glyph row (its opacity tracks whether any
         glyph shows through the mask, so the gate measures the visible word, not the mask). -->
    <div id="title" class="mask" data-safe><div class="word" id="titleWord" data-text></div></div>
  </div>
  <!-- overlay chrome lives outside the camera, so the push never moves it -->
  <div id="hud" class="abs" data-safe></div>
</div>

<!-- Cutting to music? Run beats.py, then load beats.js on the line ABOVE the kit script. -->
<script src="kit.js"></script>
<script>
const K = window.K;   // the shared kit (kit.js); global so render.py gates can read it

/* =========================================================================
   COMPOSITION SETTINGS
   ========================================================================= */
window.MOTION = {
  width: 1080, height: 1080, fps: 60, duration: 6, loop: true,
  // sound sync points: [when (s or '16b'), label, sfx palette name or null, opts?] -> render.py --hits
  hits: [[1.5, 'title-in', 'tick'], [2.0, 'pill', 'swoosh'], [4.4, 'square', 'thud']],
};
K.init(window.MOTION);   // applies ?format=9x16&w=..&h=.. (render.py --format); sets K.FORMAT, K.safe
const { width: W, height: H } = window.MOTION;

/* =========================================================================
   SCENE — replace this with the real piece. Keep every value derived from t.
   Demo: a blob morphs circle -> pill -> square while a word rises through a
   mask, letter by letter; the camera breathes; frame N == frame 0 (loop).
   ========================================================================= */
const $ = id => document.getElementById(id);
const stage = $('stage'), camera = $('camera'), blob = $('blob'), title = $('title'),
      titleWord = $('titleWord'), hud = $('hud');
const WORD = 'MOTION';
titleWord.innerHTML = [...WORD].map(c => `<span class="glyph">${c}</span>`).join('');
const glyphs = [...titleWord.children];
// Format-aware layout: one timeline, per-format numbers (K.pick). The title + shape group is
// centred on K.safe.ui (not the frame), and portrait scales the whole group up so it fills
// the tall frame instead of floating in its top half.
const L = K.pick({
  default: { font: 190, scale: 1.0,  gap: 44 },   // gap: title bottom -> shape top (px)
  '9x16':  { font: 200, scale: 1.2,  gap: 96 },   // word ~800 px, pill 768 px < K.safe.ui.w 864
  '4x5':   { font: 190, scale: 1.12, gap: 64 },
});
const fontPx = L.font, k = L.scale;
const S = K.safe.ui;
const cx = S.x + S.w / 2, cy = S.y + S.h / 2;     // the group's centre: the UI-safe centre
// The group spans the title (fontPx) + gap + the tallest shape (the 360 px square) at its low spot.
const groupH = fontPx + L.gap + 360 * k;
const titleTop = Math.round(cy - groupH / 2);  // whole px: a fractional mask edge can leave
                                                // stale glyph pixels in Chromium after a seek
const restY = cy;                                 // the lone circle sits on the group centre (frame 0)
const lowY = titleTop + fontPx + L.gap + 180 * k; // shape centre while the title is up

// Static layout, measured once after fonts load (called from window.ready below).
function layout() {
  titleWord.style.fontSize = fontPx + 'px';
  title.style.cssText = `left:0;width:${W}px;top:${titleTop}px;height:${fontPx}px;text-align:center`;
  // shrink the mask to the word (plus side bearings) so its box is honest for the safe-area gate
  const a = glyphs[0].offsetLeft, b = glyphs[glyphs.length - 1].offsetLeft + glyphs[glyphs.length - 1].offsetWidth;
  const mw = Math.ceil(b - a + fontPx * 0.3);
  title.style.left = Math.round(cx - mw / 2) + 'px'; title.style.width = mw + 'px';
  // hud: bottom-left corner of the UI-safe rect
  hud.style.cssText = `left:${S.x}px;top:${S.y + S.h - 22}px`;
}
/* BEAT-TIMED EXAMPLE (uncomment once beats.js is included; times are then in beats):
   K.T(n) = seconds of beat n; track / springTrack / stagger also take '8b'-style strings.
     const at = K.T;
     const pop = K.track([[at(7.9), 0], [at(8), 1, K.ease.outExpo], [at(12), 1], [at(12.5), 0]], t);
     const glyphT = K.stagger(t, '8b', i, '0.25b');            // one glyph per 1/16 note
     const zoom = K.springTrack([[0, 1], ['16b', 1.08]], t, 22); // punch-in on the drop
*/
const entrance = K.bezier(.16, 1, .3, 1);
const morph = K.bezier(.45, 0, .15, 1);

function render(t) {
  const D = window.MOTION.duration;
  // camera: slow continuous push, returns to 1.0 at the loop seam
  const push = 1 + 0.035 * Math.sin(Math.PI * (t / D));
  camera.style.transform = `scale(${push})`;

  // blob: size/radius keyframes (closed form, eased), back to start at D
  const bw = k * K.track([[0, 220], [1.2, 220], [2.0, 640, morph], [3.6, 640], [4.4, 360, morph], [5.2, 220, morph], [D, 220]], t);
  const bh = k * K.track([[0, 220], [1.2, 220], [2.0, 220, morph], [3.6, 220], [4.4, 360, morph], [5.2, 220, morph], [D, 220]], t);
  const br = k * K.track([[0, 110], [3.6, 110], [4.4, 48, morph], [5.2, 110, morph], [D, 110]], t);
  const y0 = restY, y1 = lowY;
  const by = K.track([[0, y0], [0.8, y0], [1.6, y1, morph], [4.6, y1], [5.4, y0, morph], [D, y0]], t);
  blob.style.cssText = `width:${bw}px;height:${bh}px;border-radius:${br}px;background:var(--accent);
    transform:translate(${cx - bw / 2}px,${by - bh / 2}px)`;

  // pill becomes a progress bar during its hold (no dead time), then empties before the next morph
  const fillP = K.ease.inOutCubic(K.seg(t, 2.0, 3.5)) * (1 - K.ease.inCubic(K.seg(t, 3.5, 3.8)));
  $('fill').style.cssText = `width:${Math.max(0, (bw - 28) * fillP)}px;opacity:${fillP > 0.001 ? 1 : 0}`;

  // title: letters rise through a mask line, 60ms stagger; exit downward before the loop
  let shown = false;
  glyphs.forEach((g, i) => {
    const inP = entrance(K.seg(K.stagger(t, 1.5, i, 0.06), 0, 0.7));
    const outP = K.ease.inCubic(K.seg(K.stagger(t, 4.5, i, 0.04), 0, 0.45));
    const y = (1 - inP) * fontPx * 1.3 - outP * fontPx * 1.3;   // travel > mask height so nothing peeks
    g.style.transform = `translateY(${y}px)`;
    if (Math.abs(y) < fontPx) shown = true;                       // some of this glyph is inside the mask
  });
  // Fully masked text is invisible anyway; opacity 0 then makes that explicit to the gates
  // (text_duration and safe_area read opacity and boxes, not the mask's clipping). No pixel changes.
  titleWord.style.opacity = shown ? 1 : 0;

  // hud: frame-time readout uses the *frame* time (rounded) so digits never smear under motion blur
  const ft = Math.floor(K.wrap(t, D) * window.MOTION.fps) / window.MOTION.fps;   // wrap: t=D reads like t=0
  hud.textContent = `T+${ft.toFixed(2).padStart(5, '0')}s`;
}

/* =========================================================================
   RUNTIME (shared — normally no edits needed below)
   ========================================================================= */
stage.style.width = W + 'px'; stage.style.height = H + 'px';
const params = new URLSearchParams(location.search);
const RENDER_MODE = params.has('render');

window.ready = (async () => {
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  await Promise.all([...document.images].map(img => img.decode ? img.decode().catch(() => {}) : null));
  layout();
})();
window.seek = async (t) => { await window.ready; render(t); };

function fit() {
  if (RENDER_MODE) { stage.style.transform = 'none'; return; }
  const s = Math.min(innerWidth / W, (innerHeight - 28) / H);
  stage.style.transform = `translate(${(innerWidth - W * s) / 2}px,${(innerHeight - 28 - H * s) / 2}px) scale(${s})`;
}
addEventListener('resize', fit); fit();

if (!RENDER_MODE) {
  // Preview player (never used by the renderer)
  const ui = document.createElement('div'); ui.id = 'preview-ui';
  ui.innerHTML = `<button id="pp">❚❚</button><input id="sc" type="range" min="0" step="0.001"><span id="tc"></span><span id="fmt" title="F: next format · G: safe areas">${K.FORMAT.name} ${W}×${H} · F format · G safe</span>`;
  document.body.appendChild(ui);
  const D = window.MOTION.duration, fps = window.MOTION.fps, sc = ui.querySelector('#sc'), tc = ui.querySelector('#tc');
  sc.max = D;
  let playing = !params.has('t'), t0 = performance.now(), base = parseFloat(params.get('t') || 0);
  const loop = params.get('loop') !== '0' && window.MOTION.loop !== false;
  const show = t => { window.seek(t); sc.value = t; tc.textContent = t.toFixed(3) + 's / f' + Math.round(t * fps); };
  const tick = () => {
    if (playing) { let t = base + (performance.now() - t0) / 1000; t = loop ? K.wrap(t, D) : Math.min(t, D); show(t); }
    requestAnimationFrame(tick);
  };
  const setPlay = p => { playing = p; base = +sc.value; t0 = performance.now(); ui.querySelector('#pp').textContent = p ? '❚❚' : '▶'; };
  ui.querySelector('#pp').onclick = () => setPlay(!playing);
  sc.oninput = () => { setPlay(false); show(+sc.value); };
  addEventListener('keydown', e => {
    if (e.code === 'Space') setPlay(!playing);
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { setPlay(false); show(K.clamp(+sc.value + (e.code === 'ArrowRight' ? 1 : -1) / fps, 0, D)); }
  });
  // Safe-area overlay (G): dashed = title-safe, solid = platform-UI-safe. Inside #stage, outside the camera.
  const NS = 'http://www.w3.org/2000/svg', ov = document.createElementNS(NS, 'svg');
  ov.id = 'safe-overlay'; ov.setAttribute('width', W); ov.setAttribute('height', H); ov.setAttribute('viewBox', `0 0 ${W} ${H}`);
  [['title', '#00a3ff', '14 10'], ['ui', '#ff2bd6', '']].forEach(([name, color, dash]) => {
    const r = K.safe[name], el = document.createElementNS(NS, 'rect');
    el.dataset.rect = name;
    Object.entries({ x: r.x, y: r.y, width: r.w, height: r.h, fill: 'none', stroke: color, 'stroke-width': 3, 'stroke-dasharray': dash })
      .forEach(([k, v]) => el.setAttribute(k, v));
    const label = document.createElementNS(NS, 'text');
    Object.entries({ x: r.x + 10, y: r.y + (name === 'ui' ? 56 : 28), fill: color, 'font-size': 20, 'font-family': 'ui-monospace,Menlo,monospace' })
      .forEach(([k, v]) => label.setAttribute(k, v));
    label.textContent = name === 'ui' ? 'UI-safe' : 'title-safe';
    ov.append(el, label);
  });
  stage.appendChild(ov);
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'g' || e.key === 'G') ov.style.display = ov.style.display === 'block' ? 'none' : 'block';
    if (e.key === 'f' || e.key === 'F') location.search = K.formatSearch(K.nextFormat());   // reload in the next format
  });
  window.ready.then(() => { show(base); tick(); });
}
</script>
</body>
</html>
