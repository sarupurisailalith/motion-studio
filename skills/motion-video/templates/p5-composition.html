<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motion Composition — p5.js</title>
<!--
  MOTION STUDIO — deterministic p5.js 2.x template (generative loops, flow fields, glyph type).
  Set up the project folder P:
    python3 scripts/vendor.py P p5          # vendor/p5.min.js (p5.js 2.3.4, LGPL-2.1, unmodified)
    cp templates/p5-composition.html templates/kit.js templates/kit-p5.js P/
  Render: python3 scripts/render.py P/<slug>.html --format 16x9,9x16 (add --gl only for WEBGL).

  Same contract as composition.html: window.MOTION, window.ready, window.seek(t).
  K.sketch runs p5 in instance mode with noLoop(): seek(t) sets t and calls redraw(), and
  random() is re-seeded before every draw, so the frame is a pure function of t.
  p5 rules (references/gotchas.md, "p5.js"): never frameCount / millis() / deltaTime; loop
  with K.loopNoise; pre-simulate anything that accumulates (K.presim); p5 2.x has no preload()
  (await loadFont in setup) and textToPoints reads textSize(); skip p5.sound, DOM and saveGif.
  Text people must read stays in the DOM (the gates see it); canvas text gets a K.proxy box.
  Preview: open the file (works from file:// unless setup loads files: then serve the folder):
  Space pauses, ←/→ step, F cycles formats, G shows safe areas, ?t=3.2 freezes a moment.
-->
<style>
  :root{
    --bg:#101418; --ink:#F3EFE6;
    /* System stack on purpose: no font ships with the plugin (ingest.py → assets/fonts.css for brand type). */
    --font-display: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:var(--bg)}
  #stage canvas{position:absolute;left:0;top:0}
  #cap{position:absolute;left:0;top:0;font:800 64px/1 var(--font-display);color:var(--ink);letter-spacing:-.03em;
       white-space:nowrap;opacity:0;z-index:2}
  #preview-ui{position:fixed;left:0;right:0;bottom:0;height:28px;display:flex;gap:8px;align-items:center;
      padding:0 10px;background:rgba(0,0,0,.6);color:#fff;font:12px ui-monospace,monospace;z-index:9}
  #preview-ui input{flex:1}
  #safe-overlay{position:absolute;left:0;top:0;pointer-events:none;display:none;z-index:8}
</style>
</head>
<body>
<div id="stage">
  <div id="cap" data-safe data-text>Every frame, on purpose.</div>
</div>
<script src="vendor/p5.min.js"></script>
<!-- Cutting to music? Run beats.py, then load beats.js on the line ABOVE the kit script. -->
<script src="kit.js"></script>
<script src="kit-p5.js"></script>
<script>
const K = window.K, TAU = Math.PI * 2;

/* =========================================================================
   COMPOSITION SETTINGS
   ========================================================================= */
window.MOTION = K.init({ width: 1080, height: 1080, fps: 30, duration: 6, loop: true,
  hits: [[1.2, 'caption', 'swell']] });
const { W, H } = K.FORMAT, D = window.MOTION.duration;

/* =========================================================================
   SCENE — replace with the real piece. Keep every value derived from t.
   Demo: a seamless flow field (each line integrated from a seeded start INSIDE the frame,
   noise walked around a loop circle) with seeded sparkles, and a DOM caption.
   ========================================================================= */
const stage = document.getElementById('stage'), cap = document.getElementById('cap');
stage.style.width = W + 'px'; stage.style.height = H + 'px';
const S = K.safe.ui;
const L = K.pick({ '9x16': { lines: 320, cap: 72 }, '16x9': { lines: 360, cap: 64 }, default: { lines: 280, cap: 64 } });
const PAL = { bg: '#101418', a: '#2DE2C4', b: '#FF5A3C', spark: '#FFFFFF' };

const sk = K.sketch({
  parent: stage, seed: 7,
  setup: async p => {
    // load files here, e.g. font = await p.loadFont('assets/display.ttf') (needs http preview)
  },
  draw: (p, t) => {
    const n = K.loopNoise(t, D, 0.6);                     // circle in noise space: periodic over D
    p.background(PAL.bg);
    p.noFill(); p.strokeWeight(2);
    const ca = p.color(PAL.a), cb = p.color(PAL.b);
    for (let i = 0; i < L.lines; i++) {
      let x = K.rand(1, i) * W, y = K.rand(2, i) * H;
      p.stroke(p.lerpColor(ca, cb, K.rand(3, i)));
      p.beginShape();
      for (let s = 0; s < 40; s++) {
        p.vertex(x, y);
        const a = p.noise(x * 0.0022 + n.x, y * 0.0022 + n.y, 0.5) * TAU * 2;
        x += Math.cos(a) * 6; y += Math.sin(a) * 6;
      }
      p.endShape();
    }
    // sparkles: random() is deterministic because K.sketch re-seeds before every draw
    p.noStroke(); p.fill(PAL.spark);
    for (let i = 0; i < 40; i++) {
      const sx = p.random(W), sy = p.random(H), tw = 0.5 + 0.5 * Math.sin(n.a * 3 + p.random(TAU));
      p.circle(sx, sy, 2 + 4 * tw);
    }
  },
});

const out = K.bezier(.16, 1, .3, 1);
async function render(t) {
  await sk.seek(t);
  // DOM caption: in at 1.2 s, out by 5.4 s (opacity 0 until in place: the gates read opacity)
  const p = out(K.seg(t, 1.2, 1.9)) * (1 - K.ease.inCubic(K.seg(t, 5.0, 5.4)));
  cap.style.opacity = p > 0.02 ? Math.min(1, p * 1.2) : 0;
  cap.style.transform = `translate(${Math.round(S.x + S.w / 2 - cap.offsetWidth / 2)}px,${Math.round(S.y + S.h / 2 - L.cap / 2 + (1 - p) * 30)}px)`;
}

/* =========================================================================
   RUNTIME (shared — normally no edits needed below)
   ========================================================================= */
const params = new URLSearchParams(location.search);
const RENDER_MODE = params.has('render');

window.ready = (async () => {
  cap.style.fontSize = L.cap + 'px';
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  await sk.ready;
})();
window.seek = async t => { await window.ready; await render(t); };

function fit() {
  if (RENDER_MODE) { stage.style.transform = 'none'; return; }
  const s = Math.min(innerWidth / W, (innerHeight - 28) / H);
  stage.style.transform = `translate(${(innerWidth - W * s) / 2}px,${(innerHeight - 28 - H * s) / 2}px) scale(${s})`;
}
addEventListener('resize', fit); fit();

if (!RENDER_MODE) {
  // Preview player (never used by the renderer): Space, ←/→, scrub, F formats, G safe areas
  const ui = document.createElement('div'); ui.id = 'preview-ui';
  ui.innerHTML = `<button id="pp">❚❚</button><input id="sc" type="range" min="0" step="0.001"><span id="tc"></span><span>${K.FORMAT.name} ${W}×${H} · F format · G safe</span>`;
  document.body.appendChild(ui);
  const fps = window.MOTION.fps, sc = ui.querySelector('#sc'), tc = ui.querySelector('#tc');
  sc.max = D;
  let playing = !params.has('t'), t0 = performance.now(), base = parseFloat(params.get('t') || 0);
  const show = t => { window.seek(t); sc.value = t; tc.textContent = t.toFixed(3) + 's / f' + Math.round(t * fps); };
  const tick = () => { if (playing) show(K.wrap(base + (performance.now() - t0) / 1000, D)); requestAnimationFrame(tick); };
  const setPlay = p => { playing = p; base = +sc.value; t0 = performance.now(); ui.querySelector('#pp').textContent = p ? '❚❚' : '▶'; };
  ui.querySelector('#pp').onclick = () => setPlay(!playing);
  sc.oninput = () => { setPlay(false); show(+sc.value); };
  const NS = 'http://www.w3.org/2000/svg', ov = document.createElementNS(NS, 'svg');
  ov.id = 'safe-overlay'; ov.setAttribute('width', W); ov.setAttribute('height', H);
  [['title', '#00a3ff', '14 10'], ['ui', '#ff2bd6', '']].forEach(([name, color, dash]) => {
    const r = K.safe[name], el = document.createElementNS(NS, 'rect');
    Object.entries({ x: r.x, y: r.y, width: r.w, height: r.h, fill: 'none', stroke: color, 'stroke-width': 3, 'stroke-dasharray': dash })
      .forEach(([k, v]) => el.setAttribute(k, v));
    ov.appendChild(el);
  });
  stage.appendChild(ov);
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.code === 'Space') setPlay(!playing);
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { setPlay(false); show(K.clamp(+sc.value + (e.code === 'ArrowRight' ? 1 : -1) / fps, 0, D)); }
    if (e.key === 'g' || e.key === 'G') ov.style.display = ov.style.display === 'block' ? 'none' : 'block';
    if (e.key === 'f' || e.key === 'F') location.search = K.formatSearch(K.nextFormat());
  });
  window.ready.then(() => { show(base); tick(); });
}
</script>
</body>
</html>
