<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motion Composition — Three.js</title>
<!--
  MOTION STUDIO — deterministic Three.js template.
  Copy this file AND kit.js (the shared motion kit, window.K) into the project folder.
  Vendor three first:  python3 scripts/vendor.py <this folder> three
  Render with:         python3 scripts/render.py this.html --gl

  Same contract as composition.html: window.MOTION, window.ready, window.seek(t).
  Never use THREE.Clock, AnimationMixer.update(delta) with real time, or physics steps
  that accumulate. If you need a mixer: mixer.setTime(t). If you need physics:
  simulate once up-front at fixed dt into an array, then index it by frame.
  Formats: render.py --format 9x16 loads ?format=9x16&w=1080&h=1920; K.init applies it and the
  renderer is sized from K.FORMAT. Preview: F cycles formats.
  PREVIEW OVER HTTP: ES modules don't load from file://, so serve the folder first:
    python3 -m http.server 8000   (in this folder)  ->  http://localhost:8000/<this file>.html
  render.py handles this itself; only the browser preview needs the server.
-->
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/three-addons/" } }
</script>
<!-- Cutting to music? Run beats.py, then load beats.js on the line ABOVE the kit script. -->
<script src="kit.js"></script>
</head>
<body>
<script type="module">
import * as THREE from 'three';

const K = window.K;   // the shared kit (kit.js, a classic script loaded before this module)
window.MOTION = K.init({ width: 1920, height: 1080, fps: 30, duration: 8, loop: true,
  hits: [[2.5, 'knot-formed', 'swell']] });   // sound sync points -> render.py --hits
const { W, H } = K.FORMAT, { duration: D } = window.MOTION;
const RENDER_MODE = new URLSearchParams(location.search).has('render');
const { seg, rand } = K, inOut = K.ease.inOutCubic;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
if (!RENDER_MODE) Object.assign(renderer.domElement.style, { width: '100vw', height: '100vh', objectFit: 'contain' });

const scene = new THREE.Scene();
scene.background = new THREE.Color('#0d0f12');
scene.fog = new THREE.Fog('#0d0f12', 8, 22);
// vertical FOV per format: portrait widens it so the ring still reads side to side
const camera = new THREE.PerspectiveCamera(K.pick({ '9x16': 52, '4x5': 40, '1x1': 42, default: 35 }), W / H, 0.1, 100);

// product-shot lighting: soft key from one side, rim behind, low fill
const key = new THREE.DirectionalLight('#fff4e6', 2.2); key.position.set(-4, 6, 4); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); scene.add(key);
const rim = new THREE.DirectionalLight('#9fc4ff', 2.5); rim.position.set(3, 3, -6); scene.add(rim);
scene.add(new THREE.HemisphereLight('#c9d6ff', '#1a1410', 0.35));

const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: '#15181d', roughness: .9 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

// hero: a ring of seeded blocks that assembles into a torus knot silhouette
const hero = new THREE.Mesh(new THREE.TorusKnotGeometry(1.1, 0.34, 220, 32),
  new THREE.MeshPhysicalMaterial({ color: '#ff5a1f', roughness: .25, metalness: .1, clearcoat: 1, clearcoatRoughness: .15 }));
hero.position.y = 1.6; hero.castShadow = true; scene.add(hero);

const N = 120, blocks = new THREE.InstancedMesh(new THREE.BoxGeometry(.12, .12, .12),
  new THREE.MeshStandardMaterial({ color: '#e9e4da', roughness: .6 }), N);
blocks.castShadow = true; scene.add(blocks);
const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), v = new THREE.Vector3(), s = new THREE.Vector3();

function render(t) {
  // camera: one slow eased orbit per loop, 35-55° elevation band, returns to start at D
  const ang = (t / D) * Math.PI * 2;
  const el = THREE.MathUtils.degToRad(22 + 6 * Math.sin(ang));
  const r = 10.5 - 0.8 * Math.sin(Math.PI * t / D);
  camera.position.set(Math.sin(ang) * r * Math.cos(el), 1.6 + r * Math.sin(el), Math.cos(ang) * r * Math.cos(el));
  camera.lookAt(0, 1.3, 0);

  hero.rotation.set(0.3, ang * 0.5, 0);
  const pulse = inOut(seg(t, 0.5, 2.5)) * (1 - inOut(seg(t, D - 2, D - 0.2)));
  hero.scale.setScalar(0.001 + 0.8 * pulse);

  for (let i = 0; i < N; i++) {
    const a = rand(1, i) * Math.PI * 2, rr = 2.4 + rand(2, i) * 1.6;
    const lift = Math.sin(ang * 2 + rand(3, i) * 6.283) * 0.15;
    v.set(Math.cos(a) * rr, 0.06 + (1 - pulse) * (0.4 + rand(4, i)) * 1.2 + lift, Math.sin(a) * rr);
    e.set(ang + i, ang * 2 + i, 0); q.setFromEuler(e); s.setScalar(0.6 + rand(5, i));
    blocks.setMatrixAt(i, m4.compose(v, q, s));
  }
  blocks.instanceMatrix.needsUpdate = true;
  renderer.render(scene, camera);
}

window.ready = (async () => { if (document.fonts && document.fonts.ready) await document.fonts.ready; })();  // + textures, fonts.css
window.seek = async t => render(t);

if (!RENDER_MODE) {
  const t0 = performance.now(); const tick = () => { render(((performance.now() - t0) / 1000) % D); requestAnimationFrame(tick); }; tick();
  addEventListener('keydown', e => {   // F: reload in the next format (native -> 16x9 -> 9x16 -> 1x1 -> 4x5)
    if (!e.metaKey && !e.ctrlKey && !e.altKey && (e.key === 'f' || e.key === 'F')) location.search = K.formatSearch(K.nextFormat());
  });
}
</script>
</body>
</html>
