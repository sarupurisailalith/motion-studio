<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motion Composition — Zdog</title>
<!--
  MOTION STUDIO — deterministic Zdog template (flat-round pseudo-3D: characters, props, icons).
  Set up the project folder P:
    python3 scripts/vendor.py P zdog                    # vendor/zdog.dist.min.js (+ zfont.min.js)
    python3 scripts/catalog.py use P pip parcel         # models/*.js + kit-zdog.js (+ kit.js)
    cp templates/zdog-composition.html P/<slug>.html
  Render: python3 scripts/render.py P/<slug>.html --format 16x9,9x16 (no --gl: Zdog is Canvas 2D).

  Same contract as composition.html: window.MOTION, window.ready, window.seek(t).
  Zdog is driven as a pure function of t: pose(t) sets every transform (K.Z.rig clips, K.track),
  then K.Z.render(scene, ctx, view) draws one frame. Never use Zdog.Illustration, Dragger or
  requestAnimationFrame for the picture. Read references/zdog.md before building.
  Text people must read stays in the DOM (crisp, and seen by the safe_area / text_duration
  gates); for text drawn on the canvas, use K.proxy (kit-layers.js).
  Preview: open the file (works from file://): Space pauses, ←/→ step, F cycles formats,
  G shows safe areas, ?t=3.2 freezes a moment.
-->
<style>
  :root{
    --bg:#F2EFE9; --ink:#111111;
    /* System stack on purpose: no font ships with the plugin (ingest.py → assets/fonts.css for brand type). */
    --font-display: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:var(--bg)}
  #cap{position:absolute;left:0;top:0;font:800 64px/1 var(--font-display);color:var(--ink);letter-spacing:-.03em;
       white-space:nowrap;opacity:0}
  #preview-ui{position:fixed;left:0;right:0;bottom:0;height:28px;display:flex;gap:8px;align-items:center;
      padding:0 10px;background:rgba(0,0,0,.6);color:#fff;font:12px ui-monospace,monospace;z-index:9}
  #preview-ui input{flex:1}
  #safe-overlay{position:absolute;left:0;top:0;pointer-events:none;display:none;z-index:8}
</style>
</head>
<body>
<div id="stage">
  <!-- the Zdog canvas is inserted here; DOM text sits above it -->
  <div id="cap" data-safe data-text>Round, flat, 3D.</div>
</div>
<script src="vendor/zdog.dist.min.js"></script>
<!-- Cutting to music? Run beats.py, then load beats.js on the line ABOVE the kit script. -->
<script src="kit.js"></script>
<script src="kit-zdog.js"></script>
<script src="models/pip.js"></script>
<script src="models/parcel.js"></script>
<script>
const K = window.K, TAU = Zdog.TAU;

/* =========================================================================
   COMPOSITION SETTINGS
   ========================================================================= */
window.MOTION = K.init({ width: 1080, height: 1080, fps: 30, duration: 6, loop: true,
  hits: [[0.42, 'hop', 'whoosh'], [1.02, 'land', 'thud'], [2.9, 'parcel', 'thud'], [3.2, 'wave', 'pop']] });
const { W, H } = K.FORMAT, D = window.MOTION.duration;

/* =========================================================================
   SCENE — replace with the real piece. Keep every value derived from t.
   Demo: Pip hops, a parcel drops in beside him, he waves, the caption lands, the parcel
   lifts away and the camera swings back, so frame N == frame 0.
   ========================================================================= */
const stage = document.getElementById('stage'), cap = document.getElementById('cap');
stage.style.width = W + 'px'; stage.style.height = H + 'px';
const ctx = K.Z.canvas(W, H).getContext('2d');
stage.insertBefore(ctx.canvas, cap);

// layout per format: zoom (px per model unit) and where the ground origin lands on screen
const S = K.safe.ui;
const L = K.pick({ '9x16': { zoom: 6.4, y: 0.6, cap: 76 }, '16x9': { zoom: 6.4, y: 0.64, cap: 64 },
                   '4x5': { zoom: 6.6, y: 0.62, cap: 68 }, default: { zoom: 6.2, y: 0.62, cap: 64 } });
const view = { zoom: L.zoom, cx: S.x + S.w / 2, cy: S.y + S.h * L.y };

// palette slots (brand colours go here; models never hard-code hex)
const BRAND = { primary: '#FF4D1F' };

const scene = new Zdog.Anchor();
const cam = K.Z.camera(scene);
const pip = K.Z.make('pip', cam.world, { palette: BRAND, translate: { x: -26 } });
const parcel = K.Z.make('parcel', cam.world, { translate: { x: 40 } });
const pipShadow = K.Z.shadow(pip.joints.root, () => 0, { diameter: 34, bias: K.Z.LAYERS.SHADOW, color: 'rgba(30,30,30,0.13)' });
const parcelShadow = K.Z.shadow(parcel.root, () => 0, { diameter: 46, bias: K.Z.LAYERS.SHADOW, color: 'rgba(30,30,30,0.13)' });
const rig = K.Z.rig(pip.joints);

const io = K.bezier(.45, 0, .15, 1), out = K.bezier(.16, 1, .3, 1);
function pose(t) {
  // camera: 3/4 left -> 3/4 right -> back (same at 0 and D: the loop seam)
  const yaw = K.track([[0, -TAU / 10], [1.0, -TAU / 10], [2.6, TAU / 11, io], [4.4, TAU / 11], [5.6, -TAU / 10, io]], t);
  cam.set({ yaw, pitch: 0.16 });

  // Pip: clips from the K.Z rig library, layered and time-shifted (references/zdog.md)
  rig.pose(t, [
    { clip: 'idle', period: D / 3 },                 // 3 breaths per loop: periodic
    { clip: 'hop', at: 0.3, h: 34, air: 0.6, pre: 0.12, land: 0.2 },
    { clip: 'wave', at: 3.2, len: 1.5 },
  ]);
  pip.joints.neck.rotate.y += -yaw * 0.45;          // looks at the camera a little
  pip.blink(t, [2.2, 5.1]);
  pipShadow.update();

  // parcel: drops in at 2.4, lands 2.9 (volume-preserving squash), lifts away 4.5..5.2
  parcel.root.translate.y = K.track([[0, -260], [2.4, -260], [2.9, 0, K.ease.inCubic], [4.5, 0], [5.2, -260, K.ease.inCubic]], t);
  parcel.root.rotate.y = K.track([[0, -0.6], [2.4, -0.6], [2.9, 0.15, K.ease.outCubic], [4.5, 0.15], [5.2, -0.6]], t);
  K.Z.squash(parcel.joints.hips, K.Z.settle(t - 2.9, 0.22, 8, 18));
  parcelShadow.update();
  parcelShadow.shape.scale = K.clamp(1 + parcel.root.translate.y / 300, 0.001, 1);
  parcelShadow.shape.visible = parcel.root.translate.y > -250;
}

function render(t) {
  pose(t);
  K.Z.render(scene, ctx, view);
  // DOM caption: crisp type, inside K.safe.ui, opacity 0 until it is in place (gates read opacity)
  const p = out(K.seg(t, 3.4, 4.0)) * (1 - K.ease.inCubic(K.seg(t, 4.5, 4.9)));
  cap.style.opacity = p > 0.02 ? Math.min(1, p * 1.2) : 0;
  cap.style.transform = `translate(${Math.round(S.x + S.w / 2 - cap.offsetWidth / 2)}px,${Math.round(S.y + S.h - L.cap * 1.6 + (1 - p) * 30)}px)`;
}

/* =========================================================================
   RUNTIME (shared — normally no edits needed below)
   ========================================================================= */
const params = new URLSearchParams(location.search);
const RENDER_MODE = params.has('render');

window.ready = (async () => {
  cap.style.fontSize = L.cap + 'px';
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
})();
window.seek = async t => { await window.ready; render(t); };

function fit() {
  if (RENDER_MODE) { stage.style.transform = 'none'; return; }
  const s = Math.min(innerWidth / W, (innerHeight - 28) / H);
  stage.style.transform = `translate(${(innerWidth - W * s) / 2}px,${(innerHeight - 28 - H * s) / 2}px) scale(${s})`;
}
addEventListener('resize', fit); fit();

if (!RENDER_MODE) {
  // Preview player (never used by the renderer): Space, ←/→, scrub, F formats, G safe areas
  const ui = document.createElement('div'); ui.id = 'preview-ui';
  ui.innerHTML = `<button id="pp">❚❚</button><input id="sc" type="range" min="0" step="0.001"><span id="tc"></span><span>${K.FORMAT.name} ${W}×${H} · F format · G safe</span>`;
  document.body.appendChild(ui);
  const fps = window.MOTION.fps, sc = ui.querySelector('#sc'), tc = ui.querySelector('#tc');
  sc.max = D;
  let playing = !params.has('t'), t0 = performance.now(), base = parseFloat(params.get('t') || 0);
  const show = t => { window.seek(t); sc.value = t; tc.textContent = t.toFixed(3) + 's / f' + Math.round(t * fps); };
  const tick = () => { if (playing) show(K.wrap(base + (performance.now() - t0) / 1000, D)); requestAnimationFrame(tick); };
  const setPlay = p => { playing = p; base = +sc.value; t0 = performance.now(); ui.querySelector('#pp').textContent = p ? '❚❚' : '▶'; };
  ui.querySelector('#pp').onclick = () => setPlay(!playing);
  sc.oninput = () => { setPlay(false); show(+sc.value); };
  const NS = 'http://www.w3.org/2000/svg', ov = document.createElementNS(NS, 'svg');
  ov.id = 'safe-overlay'; ov.setAttribute('width', W); ov.setAttribute('height', H);
  [['title', '#00a3ff', '14 10'], ['ui', '#ff2bd6', '']].forEach(([name, color, dash]) => {
    const r = K.safe[name], el = document.createElementNS(NS, 'rect');
    Object.entries({ x: r.x, y: r.y, width: r.w, height: r.h, fill: 'none', stroke: color, 'stroke-width': 3, 'stroke-dasharray': dash })
      .forEach(([k, v]) => el.setAttribute(k, v));
    ov.appendChild(el);
  });
  stage.appendChild(ov);
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.code === 'Space') setPlay(!playing);
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { setPlay(false); show(K.clamp(+sc.value + (e.code === 'ArrowRight' ? 1 : -1) / fps, 0, D)); }
    if (e.key === 'g' || e.key === 'G') ov.style.display = ov.style.display === 'block' ? 'none' : 'block';
    if (e.key === 'f' || e.key === 'F') location.search = K.formatSearch(K.nextFormat());
  });
  window.ready.then(() => { show(base); tick(); });
}
</script>
</body>
</html>
